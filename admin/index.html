<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      Kept out of search entirely. robots.txt also disallows /admin, but a
      Disallow only asks a crawler not to fetch the page - a URL discovered
      from a link elsewhere can still be indexed without being crawled. The
      noindex tag is what actually keeps it out of the results, and it is
      harmless alongside the Disallow.
    -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="referrer" content="same-origin" />

    <title>Kitchenlo Admin</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/css/admin.css" />
  </head>
  <body>
    <!--
      Both screens ship in the markup and are toggled with [hidden], rather
      than the sign-in form being rendered by script. That way a failure to
      load the bundle leaves a visible page instead of a blank one.
    -->

    <main id="signIn" class="signin" aria-labelledby="signInHeading">
      <form class="signin-card" id="signInForm" autocomplete="on">
        <h1 id="signInHeading">Kitchenlo</h1>
        <p class="signin-sub">Sign in to manage recipes</p>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required />

        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        />

        <p class="form-error" id="signInError" role="alert" hidden></p>
        <button type="submit" class="btn btn-primary" id="signInButton">Sign in</button>
      </form>
    </main>

    <div id="app" class="app" hidden>
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">K</span>
          <span>Kitchenlo Admin</span>
        </div>

        <nav class="tabs" aria-label="Sections">
          <button class="tab is-active" data-view="dashboard" type="button">Dashboard</button>
          <button class="tab" data-view="recipes" type="button">Recipes</button>
          <button class="tab" data-view="rotd" type="button">Recipe of the Day</button>
        </nav>

        <div class="topbar-actions">
          <button class="btn btn-publish" id="publishButton" type="button">Publish</button>
          <span class="who" id="whoami"></span>
          <button class="btn btn-quiet" id="signOutButton" type="button">Sign out</button>
        </div>
      </header>

      <!-- Status line for saves, publishes and errors. -->
      <p class="toast" id="toast" role="status" aria-live="polite" hidden></p>

      <section class="view" id="view-dashboard"></section>
      <section class="view" id="view-recipes" hidden></section>
      <section class="view" id="view-rotd" hidden></section>
      <section class="view" id="view-editor" hidden></section>
    </div>

    <noscript>
      <p style="padding: 2rem; font: 16px system-ui">
        The admin dashboard needs JavaScript enabled.
      </p>
    </noscript>

    <script defer src="/assets/js/admin.js"></script>
  </body>
</html>
